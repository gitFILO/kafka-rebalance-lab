name: rebalance-lab

x-controller-env: &controller-env
  KAFKA_PROCESS_ROLES: controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENERS: CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT
  KAFKA_LOG_DIRS: /tmp/kraft-logs
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  KAFKA_OPTS: -javaagent:/opt/jmx/agent.jar=9404:/opt/jmx-config/kafka.yml
  CLUSTER_ID: T3909ktJSpOWKMsinavf8g

x-broker-env: &broker-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka-data/logs
  KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
  KAFKA_OPTS: -javaagent:/opt/jmx/agent.jar=9404:/opt/jmx-config/kafka.yml
  CLUSTER_ID: T3909ktJSpOWKMsinavf8g
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 12
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 12
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  # 그룹 동작 관련 값은 4.1 기본값과 같지만 실험 조건을 드러내기 위해 명시한다.
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 45000
  KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 5000
  KAFKA_GROUP_CONSUMER_ASSIGNORS: uniform,range
  KAFKA_GROUP_CONSUMER_MIGRATION_POLICY: ${MIGRATION_POLICY:-bidirectional}
  # 장애 훈련용. 처리량에 맞춰 축소한 값이다(docs/stage4-drills/README.md "축척").
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
  # 기본 부하가 브로커당 약 140KB/s라 시간 보존만으로는 1시간 안에 256MB가 찬다. 파티션당 크기 상한을 함께 둔다.
  KAFKA_LOG_RETENTION_MS: ${LOG_RETENTION_MS:-3600000}
  KAFKA_LOG_RETENTION_BYTES: ${LOG_RETENTION_BYTES:-8388608}
  KAFKA_LOG_ROLL_MS: 60000
  KAFKA_OFFSETS_RETENTION_MINUTES: ${OFFSETS_RETENTION_MINUTES:-10080}
  KAFKA_OFFSETS_RETENTION_CHECK_INTERVAL_MS: ${OFFSETS_RETENTION_CHECK_INTERVAL_MS:-600000}

x-controller: &controller
  image: rebalance-lab-kafka:${KAFKA_VERSION:-4.1.2}
  restart: "no"
  stop_grace_period: 30s
  volumes:
    - ./monitoring/jmx:/opt/jmx-config:ro
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 9093"]
    interval: 5s
    timeout: 3s
    retries: 30

x-broker: &broker
  image: rebalance-lab-kafka:${KAFKA_VERSION:-4.1.2}
  restart: "no"
  # 재생성할 때 controlled shutdown이 끝나기 전에 SIGKILL되지 않도록 넉넉히 준다.
  stop_grace_period: 30s
  volumes:
    - ./monitoring/jmx:/opt/jmx-config:ro
  depends_on:
    controller-1: { condition: service_healthy }
    controller-2: { condition: service_healthy }
    controller-3: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 9092"]
    interval: 5s
    timeout: 3s
    retries: 30

x-app: &app
  image: rebalance-lab-app:latest
  profiles: ["lab"]
  restart: "no"
  stop_grace_period: 20s
  volumes:
    - ./results/runs:/runs
    - ./monitoring/jmx:/app/jmx-config:ro
  depends_on:
    broker-1: { condition: service_healthy }
    broker-2: { condition: service_healthy }
    broker-3: { condition: service_healthy }

x-app-env: &app-env
  BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
  TOPIC: ${TOPIC:-lab-events}
  RUN_DIR: /runs/${RUN_ID:-adhoc}
  GROUP_ID: ${GROUP_ID:-lab-adhoc}

x-consumer-env: &consumer-env
  <<: *app-env
  GROUP_PROTOCOL: ${GROUP_PROTOCOL:-classic}
  ASSIGNOR: ${ASSIGNOR:-range}
  REMOTE_ASSIGNOR: ${REMOTE_ASSIGNOR:-}
  STATIC_MEMBERSHIP: ${STATIC_MEMBERSHIP:-false}
  MAX_POLL_INTERVAL_MS: ${MAX_POLL_INTERVAL_MS:-30000}
  MAX_POLL_RECORDS: ${MAX_POLL_RECORDS:-100}
  PROCESS_MS: ${PROCESS_MS:-2}
  SESSION_TIMEOUT_MS: ${SESSION_TIMEOUT_MS:-}
  AUTO_OFFSET_RESET: ${AUTO_OFFSET_RESET:-latest}
  ISOLATION_LEVEL: ${ISOLATION_LEVEL:-read_uncommitted}
  POISON_POLICY: ${POISON_POLICY:-retry}
  POISON_RETRIES: ${POISON_RETRIES:-10}
  POISON_BACKOFF_MS: ${POISON_BACKOFF_MS:-}

services:
  controller-1:
    <<: *controller
    image: rebalance-lab-kafka:${CONTROLLER_1_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: controller-1
    container_name: controller-1
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - controller-1-data:/tmp/kraft-logs
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 1

  controller-2:
    <<: *controller
    image: rebalance-lab-kafka:${CONTROLLER_2_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: controller-2
    container_name: controller-2
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - controller-2-data:/tmp/kraft-logs
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 2

  controller-3:
    <<: *controller
    image: rebalance-lab-kafka:${CONTROLLER_3_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: controller-3
    container_name: controller-3
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - controller-3-data:/tmp/kraft-logs
    environment:
      <<: *controller-env
      KAFKA_NODE_ID: 3

  broker-1:
    <<: *broker
    image: rebalance-lab-kafka:${BROKER_1_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: broker-1
    container_name: broker-1
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - broker-1-data:/var/lib/kafka-data
    ports: ["19092:19092"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-1:9092,EXTERNAL://localhost:19092

  broker-2:
    <<: *broker
    image: rebalance-lab-kafka:${BROKER_2_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: broker-2
    container_name: broker-2
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - broker-2-data:/var/lib/kafka-data
    ports: ["19093:19093"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 5
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-2:9092,EXTERNAL://localhost:19093

  broker-3:
    <<: *broker
    image: rebalance-lab-kafka:${BROKER_3_VERSION:-${KAFKA_VERSION:-4.1.2}}
    hostname: broker-3
    container_name: broker-3
    volumes:
      - ./monitoring/jmx:/opt/jmx-config:ro
      - broker-3-data:/var/lib/kafka-data
    ports: ["19094:19094"]
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 6
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker-3:9092,EXTERNAL://localhost:19094

  disk-monitor:
    image: rebalance-lab-app:latest
    hostname: disk-monitor
    container_name: disk-monitor
    restart: "no"
    command: ["disk-monitor"]
    environment:
      JAVA_TOOL_OPTIONS: -Xmx48m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml
    volumes:
      - ./monitoring/jmx:/app/jmx-config:ro
      - broker-1-data:/disks/broker-1:ro
      - broker-2-data:/disks/broker-2:ro
      - broker-3-data:/disks/broker-3:ro
      # tmpfs 볼륨은 마운트한 컨테이너가 모두 멈추면 내용이 사라진다. 노드를 멈춰도 데이터가 남도록 여기서 계속 붙잡는다.
      - controller-1-data:/disks/controller-1:ro
      - controller-2-data:/disks/controller-2:ro
      - controller-3-data:/disks/controller-3:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    hostname: prometheus
    container_name: prometheus
    restart: "no"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro

  alertmanager:
    image: prom/alertmanager:v0.28.1
    hostname: alertmanager
    container_name: alertmanager
    restart: "no"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana-oss:12.1.1
    hostname: grafana
    container_name: grafana
    restart: "no"
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  producer:
    <<: *app
    hostname: producer
    container_name: producer
    command: ["producer"]
    environment:
      <<: *app-env
      RATE: ${RATE:-600}
      VALUE_BYTES: ${VALUE_BYTES:-0}
      BUFFER_MEMORY: ${BUFFER_MEMORY:-33554432}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-1048576}
      TRANSACTIONAL: ${TRANSACTIONAL:-false}
      TRANSACTION_TIMEOUT_MS: ${TRANSACTION_TIMEOUT_MS:-60000}
      JAVA_TOOL_OPTIONS: -Xmx192m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml

  # D15 컴팩션 훈련에서만 띄운다.
  state-producer:
    <<: *app
    hostname: state-producer
    container_name: state-producer
    command: ["state-producer"]
    environment:
      BOOTSTRAP_SERVERS: broker-1:9092,broker-2:9092,broker-3:9092
      STATE_TOPIC: ${STATE_TOPIC:-lab-state}
      STATE_KEYS: ${STATE_KEYS:-1000}
      STATE_RATE: ${STATE_RATE:-400}
      STATE_VALUE_BYTES: ${STATE_VALUE_BYTES:-250}
      JAVA_TOOL_OPTIONS: -Xmx128m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml

  lag-monitor:
    <<: *app
    hostname: lag-monitor
    container_name: lag-monitor
    command: ["lag-monitor"]
    environment:
      <<: *app-env
      SAMPLE_MS: ${SAMPLE_MS:-1000}
      JAVA_TOOL_OPTIONS: -Xmx128m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml

  consumer-1:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_1_TAG:-latest}
    hostname: consumer-1
    container_name: consumer-1
    command: ["consumer"]
    ports: ["9101:9101"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-1
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9101 -Dcom.sun.management.jmxremote.rmi.port=9101 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

  consumer-2:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_2_TAG:-latest}
    hostname: consumer-2
    container_name: consumer-2
    command: ["consumer"]
    ports: ["9102:9102"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-2
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9102 -Dcom.sun.management.jmxremote.rmi.port=9102 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

  consumer-3:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_3_TAG:-latest}
    hostname: consumer-3
    container_name: consumer-3
    command: ["consumer"]
    ports: ["9103:9103"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-3
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9103 -Dcom.sun.management.jmxremote.rmi.port=9103 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

  consumer-4:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_4_TAG:-latest}
    hostname: consumer-4
    container_name: consumer-4
    command: ["consumer"]
    ports: ["9104:9104"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-4
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9104 -Dcom.sun.management.jmxremote.rmi.port=9104 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

  consumer-5:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_5_TAG:-latest}
    hostname: consumer-5
    container_name: consumer-5
    command: ["consumer"]
    ports: ["9105:9105"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-5
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9105 -Dcom.sun.management.jmxremote.rmi.port=9105 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

  consumer-6:
    <<: *app
    image: rebalance-lab-app:${CONSUMER_6_TAG:-latest}
    hostname: consumer-6
    container_name: consumer-6
    command: ["consumer"]
    ports: ["9106:9106"]
    environment:
      <<: *consumer-env
      MEMBER_NAME: consumer-6
      JAVA_TOOL_OPTIONS: -Xmx160m -javaagent:/app/jmx/agent.jar=9404:/app/jmx-config/client.yml -Dcom.sun.management.jmxremote.port=9106 -Dcom.sun.management.jmxremote.rmi.port=9106 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost

# 디스크 풀 훈련을 위해 브로커 데이터 디렉터리를 용량 제한 tmpfs로 둔다. 실제 사용량만큼만 메모리를 쓴다.
x-broker-disk: &broker-disk
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: size=${BROKER_DISK_MB:-256}m,mode=1777

x-controller-disk: &controller-disk
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: size=64m,mode=1777

volumes:
  controller-1-data: *controller-disk
  controller-2-data: *controller-disk
  controller-3-data: *controller-disk
  broker-1-data: *broker-disk
  broker-2-data: *broker-disk
  broker-3-data: *broker-disk
